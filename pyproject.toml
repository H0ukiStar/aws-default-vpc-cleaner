[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-default-vpc-cleaner"
version = "1.0.0"
description = "Tool to delete default VPCs and related resources across all AWS regions"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "H0ukiStar"}
]
keywords = ["aws", "vpc", "cleaner", "default-vpc"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "boto3>=1.34.0",
]

[project.optional-dependencies]
dev = [
    "boto3-stubs[ec2]>=1.34.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "moto[ec2]>=5.0.0",
    "mypy>=1.8.0",
    "black>=24.0.0",
    "flake8>=7.0.0",
    "isort>=5.13.0",
]

[project.scripts]
aws-default-vpc-cleaner = "src.main:main"

[tool.setuptools]
py-modules = ["src.main", "src.aws_client", "src.default_vpc_cleaner", "src.i18n", "src.constants"]

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=src --cov-report=term-missing --cov-report=html"

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/test_*.py"]
